name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-test-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            target: windows-x64
            os: windows-latest
          - name: Windows ARM64
            target: windows-arm64
            os: windows-11-arm
          - name: Linux x64
            target: linux-x64
            os: ubuntu-24.04
          - name: Linux ARM64
            target: linux-arm64
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout zcstream-app
        uses: actions/checkout@v4

      - name: Install Linux GUI & Vulkan system dependencies
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release
